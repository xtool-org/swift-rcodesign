name: Build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: xcode-27
            target: aarch64-apple-darwin
          - runner: xcode-27
            target: x86_64-apple-darwin
          - runner: xcode-27
            target: aarch64-apple-ios
          - runner: xcode-27
            target: aarch64-apple-ios-sim
          - runner: xcode-27
            target: x86_64-apple-ios
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    env:
      RUST_TARGETS: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup target add --toolchain 1.95.0 "$RUST_TARGETS"

      - name: Build and test
        run: |
          set -euo pipefail
          make build
          # Only the native slice can be linked into this runner's Swift tests.
          if [[ "$RUST_TARGETS" == "$(rustc -vV | sed -n 's/^host: //p')" ]]; then
            make test-without-building
          fi
